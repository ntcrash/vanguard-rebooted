<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanguard Rebooted</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="labels"></div>

      <div id="hud">
        <div id="status">Create your character to join</div>
        <div id="help">
          WASD move · drag mouse to rotate camera · scroll to zoom · click or F to attack mobs/players ·
          Enter to chat
        </div>
        <div id="attack-cooldown">
          <div id="attack-cooldown-fill" class="ready"></div>
        </div>
      </div>

      <div id="chat">
        <div id="chat-log"></div>
        <input id="chat-input" type="text" placeholder="Press Enter to chat…" maxlength="240" />
      </div>

      <div id="login-screen">
        <div id="login-panel">
          <h1>Vanguard Rebooted</h1>
          <p class="subtitle">Create your character</p>

          <label for="name-input">Name</label>
          <input
            id="name-input"
            type="text"
            maxlength="20"
            placeholder="Enter a name…"
            autocomplete="off"
            spellcheck="false"
          />

          <label>Color</label>
          <div id="color-swatches"></div>

          <p id="login-error"></p>

          <button id="enter-world-btn" type="button">Enter World</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
